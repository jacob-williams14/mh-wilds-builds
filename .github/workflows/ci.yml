name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for every job's GITHUB_TOKEN; the deploy job
# re-elevates itself with packages: write for the GHCR push.
permissions:
  contents: read

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

# Deployment is handled by Render's static-site Blueprint (render.yaml) — Render builds
# from the repo on every push to main. The former image pipeline (build → GHCR → deploy
# hook) was removed 2026-07-09; recover it from git history if an image-backed deploy is
# ever needed again. The Dockerfile/compose remain for local prod-parity runs.
