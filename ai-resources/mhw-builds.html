function switchWeapon(w){W=w;document.querySelectorAll('.weapon-tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+w).classList.add('active');resetFlow();init()}
function init(){const f=D[W].flow;document.getElementById('flow-title').textContent=f.title;document.getElementById('q1-text').textContent=f.q1;document.getElementById('sources-box').innerHTML=D[W].src;const o=document.getElementById('q1-options');o.innerHTML='';f.opts.forEach(x=>{const b=document.createElement('button');b.className='opt-btn'+(x.c?' '+x.c:'');b.textContent=x.l;b.onclick=function(){answer(1,x.v)};o.appendChild(b)})}
function answer(s,v){ans[s]=v;const q=document.getElementById('q'+s);q.classList.remove('active');q.classList.add('completed');q.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));if(event&&event.target)event.target.classList.add('selected');s===1?showQ2(v):showResult(v)}
function showQ2(p){document.getElementById('c1').classList.remove('hidden');const q=document.getElementById('q2');q.classList.remove('hidden');q.classList.add('active');const cfg=D[W].flow.q2[p];document.getElementById('q2-text').textContent=cfg.t;const o=document.getElementById('q2-options');o.innerHTML='';cfg.o.forEach(x=>{const b=document.createElement('button');b.className='opt-btn'+(x.c?' '+x.c:'');b.textContent=x.l;b.onclick=function(){answer(2,x.v)};o.appendChild(b)});q.scrollIntoView({behavior:'smooth',block:'center'})}
function showResult(k){const b=D[W].builds[k],r=document.getElementById('result');let ah='';for(const[s,p]of Object.entries(b.armor))ah+=`<div class="gear-slot"><div class="gear-slot-label">${s}</div><div class="gear-slot-value">${p}</div></div>`;const ds=b.skills.filter(s=>s.t==='d').map(s=>`<span class="skill-tag">${s.n}</span>`).join('');const cs=b.skills.filter(s=>s.t==='c').map(s=>`<span class="skill-tag cs">${s.n}</span>`).join('');const ss=b.set.map(s=>`<span class="skill-tag ss">${s}</span>`).join('');let wh;if(W==='bow')wh=D[W].weapons.map(w=>`<div class="weapon-card"><div class="weapon-element ${w.cls}">${w.element}</div><div class="weapon-name">${w.name}</div><div class="weapon-stat">${w.info}</div></div>`).join('');else wh=D[W].weapons.map(w=>`<div class="weapon-card"><div class="weapon-name">${w.name}</div><div class="weapon-detail">${w.info}</div></div>`).join('');const re=[{k:'fire',l:'Fire',c:'var(--fire)'},{k:'water',l:'Water',c:'var(--water)'},{k:'thunder',l:'Thunder',c:'var(--thunder)'},{k:'ice',l:'Ice',c:'var(--ice)'},{k:'dragon',l:'Dragon',c:'var(--dragon)'}];let rh=re.map(e=>{const v=b.res[e.k],cl=v>0?'pos':v<0?'neg':'neu',sg=v>0?'+':'',bw=Math.min(Math.abs(v)/20*50,50);return`<div class="res-item"><div class="res-label" style="color:${e.c}">${e.l}</div><div class="res-value ${cl}">${sg}${v}</div><div class="res-bar-track"><div class="res-bar-center"></div><div style="position:absolute;top:0;height:100%;border-radius:2px;width:${bw}%;background:${e.c};opacity:.7;${v>=0?'left:50%':'right:50%'}"></div></div></div>`}).join('');const wk=re.filter(e=>b.res[e.k]<-5),st=re.filter(e=>b.res[e.k]>5);let vd='';if(!wk.length&&!st.length)vd='<strong>Verdict:</strong> Fairly neutral resistances.';else{let p=[];if(wk.length)p.push(`<strong>Watch out for:</strong> ${wk.map(e=>`${e.l} (${b.res[e.k]})`).join(', ')}.`);if(st.length)p.push(`<strong>Strong against:</strong> ${st.map(e=>`${e.l} (+${b.res[e.k]})`).join(', ')}.`);vd=p.join(' ')}
const wl=W==='bow'?'Non-Artian Bows (Compendium Picks)':'Non-Artian Insect Glaives';const cl=W==='bow'?'Comfort Skills':'Comfort / Mobility';
r.innerHTML=`<div class="result-header"><div class="result-name">${b.name}</div><div class="result-stars">${b.stars}</div></div><div style="margin-bottom:8px"><span class="skill-tag ss" style="font-size:.75rem">Source: ${b.source}</span></div><div class="result-desc">${b.desc}</div><div class="skills-title" style="margin-top:20px">Armor Pieces</div><div class="gear-grid">${ah}</div><div style="margin-top:24px"><div class="skills-title">Elemental Resistances</div><div class="res-grid">${rh}</div><div class="res-verdict">${vd}</div></div><div style="margin-top:24px"><div class="skills-title">Offensive Skills</div><div class="skill-tags">${ds}</div></div><div style="margin-top:12px"><div class="skills-title">${cl}</div><div class="skill-tags">${cs}</div></div><div style="margin-top:12px"><div class="skills-title">Set / Group Skills</div><div class="skill-tags">${ss}</div></div><div class="note-box" style="margin-top:20px"><strong>Meal Setup:</strong> ${b.meal}</div><div style="margin-top:20px"><div class="skills-title">${wl}</div><div class="weapon-grid">${wh}</div></div>`;
document.getElementById('c1').classList.remove('hidden');r.classList.add('visible');r.scrollIntoView({behavior:'smooth',block:'center'})}
function resetFlow(){ans={};['q1','q2'].forEach(id=>{const e=document.getElementById(id);e.classList.remove('active','completed');id==='q1'?e.classList.add('active'):e.classList.add('hidden');e.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'))});['c1','c2'].forEach(id=>document.getElementById(id).classList.add('hidden'));const r=document.getElementById('result');r.classList.remove('visible');r.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
init();
</script>
